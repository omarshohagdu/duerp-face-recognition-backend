[package]
name = "duerp-attendance"
version = "0.1.0"
edition = "2024"
description = "WOW face-based attendance service, split out of duerp-api"

[[bin]]
name = "duerp-attendance"
path = "src/main.rs"

[dependencies]
actix-web = "4.10"
actix-cors = "0.7"
actix-files = "0.6.8"
actix-multipart = "0.7.0"
actix-service = "2.0.0"
actix-web-httpauth = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database — Postgres only. The attendance module never touched MySQL, so the
# `mysql` feature duerp-api carries is dropped here.
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono", "migrate", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }

# Outbound HTTP: AI face platform + DU backend lookups.
reqwest = { version = "0.12", features = ["json", "multipart"] }

jsonwebtoken = "9.3"
futures-util = "0.3.31"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
base64 = "0.22"
tokio = "1.48.0"
env_logger = "0.11.8"
log = "0.4.27"

# Image downscaling before forwarding face captures to the AI platform.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
# The DB-backed tests in tests/ drive the SQL functions directly and need a
# runtime; the crate's own tokio dependency carries no feature flags.
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }